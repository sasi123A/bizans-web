<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bizans RP</title>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;500;700&display=swap');
    
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      background-color: #1a0012; color: #fdfbf7;
      font-family: 'Montserrat', sans-serif;
      display: flex; height: 100vh; overflow: hidden;
    }
    
    /* Split-screen Layout */
    .left-panel {
      flex: 1;
      background: linear-gradient(135deg, #3a002c 0%, #1d0016 100%);
      border-right: 4px solid #d4af37;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      text-align: center; padding: 40px;
    }
    .left-panel h1 {
      font-family: 'Cinzel', serif;
      color: #d4af37; font-size: 3rem; margin: 10px 0;
      text-shadow: 0px 4px 10px rgba(212, 175, 55, 0.4);
    }
    .left-panel p { color: #f3e5ab; font-size: 1.1rem; letter-spacing: 1px; }

    .right-panel {
      flex: 1.2; padding: 50px;
      display: flex; flex-direction: column;
      justify-content: center; overflow-y: auto;
      background: #14000e;
    }
    .right-panel h3 {
      font-family: 'Cinzel', serif; color: #d4af37;
      border-bottom: 2px solid #d4af37; padding-bottom: 8px;
      margin-top: 0; margin-bottom: 20px;
    }

    /* Styled Input Fields & Buttons */
    input {
      background: #2b0020; border: 2px solid #4a0038;
      color: #fdfbf7; padding: 12px; border-radius: 4px;
      margin-bottom: 15px; width: 100%; font-size: 1rem;
      transition: all 0.3s ease;
    }
    input:focus {
      outline: none; border-color: #d4af37;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
    }
    button {
      background: linear-gradient(135deg, #d4af37 0%, #aa841b 100%);
      color: #1a0012; border: none; padding: 12px 20px;
      font-family: 'Cinzel', serif; font-weight: bold; font-size: 1rem;
      border-radius: 4px; cursor: pointer; width: 100%;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.2s, background 0.3s;
    }
    button:hover { background: #ffd700; transform: translateY(-2px); }
    button:active { transform: translateY(0); }

    /* Forms */
    .form-group { margin-bottom: 25px; }

    /* Admin Panel and Live User Table */
    #admin-panel { margin-top: 30px; animation: fadeIn 0.5s ease; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; border: 1px solid #d4af37; }
    th, td { border: 1px solid #4a0038; padding: 12px; text-align: left; }
    th { background-color: #2b0020; color: #d4af37; font-family: 'Cinzel', serif; }
    td { background-color: #1c0014; }
    
    .btn-delete {
      background: #800020; color: #fdfbf7; border: 1px solid #d4af37;
      padding: 6px 12px; font-size: 0.8rem; width: auto;
    }
    .btn-delete:hover { background: #b00020; }
    .hidden { display: none; }
    
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>

  <div class="left-panel">
    <h1>BIZANS RP</h1>
    <p>IMPERIAL ROLEPLAY EXPERIENCE</p>
  </div>

  <div class="right-panel">
    <div id="auth-section">
      <div class="form-group">
        <h3>Join the Empire (Sign Up)</h3>
        <form id="signup-form">
          <input type="text" id="signup-user" placeholder="Username" required>
          <input type="email" id="signup-email" placeholder="Email Address" required>
          <input type="password" id="signup-pass" placeholder="Password" required>
          <button type="submit">REGISTER CITIZEN</button>
        </form>
      </div>

      <div class="form-group">
        <h3>Access Portal (Login)</h3>
        <form id="login-form">
          <input type="text" id="login-user" placeholder="Username" required>
          <input type="password" id="login-pass" placeholder="Password" required>
          <button type="submit">ENTER REALM</button>
        </form>
      </div>
    </div>

    <div id="admin-panel" class="hidden">
      <h3>Imperial Archives (Admin Panel)</h3>
      <table>
        <thead>
          <tr>
            <th>Username</th>
            <th>Email</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="users-table-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDbJDYEg0_XZTfjUkU4-Rp9PegZbEfjcuE",
      authDomain: "bizans-rp.firebaseapp.com",
      projectId: "bizans-rp",
      storageBucket: "bizans-rp.firebasestorage.app",
      messagingSenderId: "909091631046",
      appId: "1:909091631046:web:4b170129bd67cb6ef84cc7",
      measurementId: "G-EYQ5C6C86M"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('signup-user').value;
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-pass').value;

      try {
        await db.collection('users').add({ username, email, password });
        alert('Citizen registered in the archives!');
        e.target.reset();
      } catch (err) {
        alert('Error: ' + err.message);
      }
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('login-user').value;
      const password = document.getElementById('login-pass').value;

      if (username === "Konstantinos" && password === "1234.1234.Asd") {
        alert('Imperial Admin recognized!');
        document.getElementById('admin-panel').classList.remove('hidden');
        loadUsersLive();
        return;
      }

      try {
        const snap = await db.collection('users')
          .where('username', '==', username)
          .where('password', '==', password)
          .get();

        if (!snap.empty) {
          alert(`Welcome back, ${username}!`);
        } else {
          alert('Access Denied. Credentials invalid.');
        }
      } catch (err) {
        alert('Authentication failed: ' + err.message);
      }
    });

    let liveUnsubscribe = null;
    function loadUsersLive() {
      if (liveUnsubscribe) liveUnsubscribe();
      liveUnsubscribe = db.collection('users').onSnapshot((snap) => {
        const tbody = document.getElementById('users-table-body');
        tbody.innerHTML = '';
        snap.forEach((doc) => {
          const u = doc.data();
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${u.username || 'N/A'}</td>
            <td>${u.email || 'N/A'}</td>
            <td><button class="btn-delete" onclick="deleteUser('${doc.id}')">Exile (Delete)</button></td>
          `;
          tbody.appendChild(tr);
        });
      });
    }

    window.deleteUser = async (id) => {
      if (confirm('Permanently remove this citizen?')) {
        try {
          await db.collection('users').doc(id).delete();
        } catch (err) {
          alert('Error: ' + err.message);
        }
      }
    };
  </script>
</body>
</html>
